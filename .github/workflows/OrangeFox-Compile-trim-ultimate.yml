name: OrangeFox - Build

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'OrangeFox Device Tree'
        required: true
        default: 'https://github.com/cd-Crypton/custom_recovery_tree_realme_nashc'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/realme/nashc'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'nashc'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      PARTITION_SIZE:
        description: 'Recovery partition size in bytes (BOARD_RECOVERYIMAGE_PARTITION_SIZE)'
        required: false
        default: '33554432'
      KEEP_LANGS:
        description: 'Languages to keep in the trimmed ramdisk (comma separated)'
        required: false
        default: 'en,uk_UA,ru'

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
              
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh
      
    - name: Set-up Manifest
      if: inputs.MANIFEST_BRANCH == '11.0' || inputs.MANIFEST_BRANCH == '12.1'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Prepare trim tool
      run: |
        cat > ${GITHUB_WORKSPACE}/fox_trim.py <<'PYEOF'
        #!/usr/bin/env python3
        """fox_trim.py ramdisk FILE            - обрізати ramdisk (gzip cpio) на місці
           fox_trim.py image IN OUT MAXBYTES  - обрізати ramdisk усередині recovery.img (boot v0-v2)"""
        import gzip, hashlib, os, re, struct, sys

        KEEP_LANGS = os.environ.get("KEEP_LANGS", "en,uk_UA,ru").split(",")
        TERMINFO_KEEP = re.compile(r"^(linux|xterm|xterm-256color|xterm-color|vt100|vt102|"
                                   r"screen|screen-256color|tmux|tmux-256color|ansi|dumb|rxvt)$")
        DROP_EXACT = {
            "system/lib64/libclang_rt.ubsan_standalone-aarch64-android.so",
            "system/lib64/libssh.so", "system/lib64/libxml2.so",
            "system/lib64/libext2_profile.so", "system/lib64/libservices.so",
            "twres/fonts/Chococooky.ttf", "twres/fonts/Exo2-Medium.ttf",
            "twres/fonts/FiraCode-Medium.ttf",
        }

        def drop(name):
            if name in DROP_EXACT:
                return True
            if name.startswith("res/images/") and name != "res/images/font.png" \
                    and not name.endswith("dummyfile"):
                return True
            m = re.match(r"system/etc/terminfo/[^/]+/([^/]+)$", name)
            if m and not TERMINFO_KEEP.match(m.group(1)):
                return True
            m = re.match(r"twres/languages/([^/]+)\.xml$", name)
            if m and m.group(1) not in KEEP_LANGS:
                return True
            return False

        pad4 = lambda n: (-n) % 4

        def trim_ramdisk(ramdisk):
            cpio = gzip.decompress(ramdisk)
            ents, i = [], 0
            while True:
                assert cpio[i:i+6] == b"070701", "bad cpio"
                f = [int(cpio[i+6+8*k:i+14+8*k], 16) for k in range(13)]
                nsz, fsz = f[11], f[6]
                name = cpio[i+110:i+109+nsz].decode()
                ds = i + 110 + nsz; ds += pad4(ds)
                ents.append([f, name, cpio[ds:ds+fsz]])
                i = ds + fsz; i += pad4(i)
                if name == "TRAILER!!!":
                    break
            gone = {n for f, n, _ in ents if (f[1] & 0o170000) == 0o100000 and drop(n)}
            # ramdisk-files.txt / .sha256sum: recovery перебудовує ramdisk за цим списком -> чистимо його теж
            for e in ents:
                if e[1] in ("ramdisk-files.txt", "ramdisk-files.sha256sum"):
                    keep = []
                    for ln in e[2].decode().splitlines(True):
                        path = ln.rstrip("\n")
                        if e[1].endswith("sum"):
                            path = path.split("  ", 1)[-1]
                        if (path[2:] if path.startswith("./") else path) in gone:
                            continue
                        keep.append(ln)
                    e[2] = "".join(keep).encode()
            out, saved = [], 0
            for f, name, data in ents:
                if name in gone:
                    saved += len(data); continue
                f = list(f); f[6] = len(data); f[11] = len(name.encode()) + 1
                h = b"070701" + b"".join(b"%08X" % v for v in f)
                h += name.encode() + b"\0"; h += b"\0" * pad4(len(h))
                out.append(h + data + b"\0" * pad4(len(data)))
            new = b"".join(out)
            new += b"\0" * pad4(len(new))
            new_rd = gzip.compress(new, 9, mtime=0)
            print(f"[fox_trim] removed {len(gone)} files, {saved/1048576:.2f} MiB raw; "
                  f"ramdisk {len(ramdisk)/1048576:.2f} -> {len(new_rd)/1048576:.2f} MiB", flush=True)
            return new_rd

        def trim_image(img, out_path, max_size):
            d = open(img, "rb").read()
            assert d[:8] == b"ANDROID!", "not an Android boot image"
            ks, ka, rs, ra, ss, sa, ta, ps, hv = struct.unpack("<9I", d[8:44])
            assert hv <= 2, "header v%d not supported" % hv
            al = lambda x: (x + ps - 1) // ps * ps
            o = ps
            kernel = d[o:o+ks]; o += al(ks)
            ramdisk = d[o:o+rs]; o += al(rs)
            second = d[o:o+ss]; o += al(ss)
            dtbo = dtb = b""
            if hv >= 1:
                n = struct.unpack("<I", d[1632:1636])[0]
                dtbo = d[o:o+n]; o += al(n)
            if hv >= 2:
                n = struct.unpack("<I", d[1648:1652])[0]
                dtb = d[o:o+n]
            new_rd = trim_ramdisk(ramdisk)
            hdr = bytearray(d[:ps])
            struct.pack_into("<I", hdr, 16, len(new_rd))
            if hv >= 1:
                struct.pack_into("<Q", hdr, 1636, ps + al(len(kernel)) + al(len(new_rd)) + al(len(second)))
            sha = hashlib.sha1()
            parts = [kernel, new_rd, second] + ([dtbo] if hv >= 1 else []) + ([dtb] if hv >= 2 else [])
            for p in parts:
                sha.update(p); sha.update(struct.pack("<I", len(p)))
            hdr[576:608] = sha.digest().ljust(32, b"\0")
            body = bytearray(hdr)
            for p in parts:
                body += p + b"\0" * (al(len(p)) - len(p))
            open(out_path, "wb").write(body)
            print(f"[fox_trim] image {len(d)} -> {len(body)} bytes, limit {max_size}, "
                  f"margin {(max_size-len(body))/1048576:+.2f} MiB")
            return 0 if len(body) <= max_size else 2

        if __name__ == "__main__":
            if sys.argv[1] == "ramdisk":
                p = sys.argv[2]
                open(p + ".tmp", "wb").write(trim_ramdisk(open(p, "rb").read()))
                os.replace(p + ".tmp", p)
            else:
                sys.exit(trim_image(sys.argv[2], sys.argv[3], int(sys.argv[4])))
        PYEOF
        python3 -m py_compile ${GITHUB_WORKSPACE}/fox_trim.py

    - name: Building OrangeFox
      id: build
      continue-on-error: true   # якщо обгортка не спрацює і образ завеликий - запасний крок нижче
      env:
        KEEP_LANGS: ${{ inputs.KEEP_LANGS }}
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng && make clean

        # Обгортка над mkbootimg: перед створенням образу обрізає ramdisk-recovery.img,
        # тож штатна збірка проходить до кінця (AVB footer і OrangeFox zip створюються як завжди).
        if [ "${{ inputs.BUILD_TARGET }}" = "recovery" ]; then
          mka mkbootimg || echo "::warning::could not pre-build mkbootimg"
          BIN=out/host/linux-x86/bin
          if [ -e ${BIN}/mkbootimg ] && [ ! -e ${BIN}/mkbootimg.real ]; then
            mv ${BIN}/mkbootimg ${BIN}/mkbootimg.real
            cat > ${BIN}/mkbootimg <<'WRAP'
        #!/bin/bash
        real="$(dirname "$(readlink -f "$0")")/mkbootimg.real"
        args=("$@")
        for i in "${!args[@]}"; do
          if [ "${args[$i]}" = "--ramdisk" ] && [[ "${args[$((i+1))]}" == *ramdisk-recovery* ]]; then
            python3 @TRIM@ ramdisk "${args[$((i+1))]}" || echo "[fox_trim] WARNING: trim failed, original ramdisk used" >&2
          fi
        done
        exec "$real" "$@"
        WRAP
            sed -i "s#@TRIM@#${GITHUB_WORKSPACE}/fox_trim.py#" ${BIN}/mkbootimg
            chmod +x ${BIN}/mkbootimg
            echo "mkbootimg wrapper installed"
          fi
        fi

        mka adbd ${{ inputs.BUILD_TARGET }}image

    - name: Fallback - trim finished recovery.img
      if: inputs.BUILD_TARGET == 'recovery' && steps.build.outcome == 'failure'
      env:
        KEEP_LANGS: ${{ inputs.KEEP_LANGS }}
        PARTITION_SIZE: ${{ inputs.PARTITION_SIZE }}
      run: |
        set -e
        TREE=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        OUT=${TREE}/out/target/product/${{ inputs.DEVICE_NAME }}
        if [ ! -f "${OUT}/recovery.img" ]; then
          echo "::error::recovery.img not found - the build failed before the image was created"
          exit 1
        fi
        MAX_SIZE=$((PARTITION_SIZE - 69632))   # місце під AVB footer
        cp ${OUT}/recovery.img ${RUNNER_TEMP}/recovery.orig.img
        python3 ${GITHUB_WORKSPACE}/fox_trim.py image ${RUNNER_TEMP}/recovery.orig.img ${OUT}/recovery.img ${MAX_SIZE}
        cd ${TREE}
        out/host/linux-x86/bin/avbtool add_hash_footer \
          --image ${OUT}/recovery.img \
          --partition_size ${PARTITION_SIZE} --partition_name recovery \
          --algorithm SHA256_RSA4096 --key external/avb/test/data/testkey_rsa4096.pem \
          --prop com.android.build.recovery.fingerprint:$(cat ${OUT}/build_fingerprint.txt) \
          --prop com.android.build.boot.os_version:16.1.0 \
          --prop com.android.build.boot.security_patch:2099-12-31 \
          --rollback_index 1 || echo "::warning::avbtool failed, image has no AVB footer"
        echo "::warning::Fallback used: OrangeFox*.zip was NOT generated, flash recovery.img via fastboot/SP Flash Tool"

    - name: Show result
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}
        ls -l recovery.img OrangeFox*.zip 2>&1 || true

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - Unofficial
          Build: fox_${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
          
