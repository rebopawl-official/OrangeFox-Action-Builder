name: OrangeFox - Build (trimmed)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Manifest branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
          - '11.0'
      DEVICE_TREE:
        description: 'Device tree repository link'
        required: true
        default: 'https://github.com/rebopawl-official/device_wheatek_WP19'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device path (device/vendor/codename)'
        required: true
        default: 'device/wheatek/WP19'
      DEVICE_NAME:
        description: 'Device codename (as in twrp_<NAME>.mk)'
        required: true
        default: 'WP19'
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - boot
          - vendorboot
      TRIM_LANGUAGES:
        description: 'Also delete all UI languages except en / uk_UA / ru (extra space saving)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Install build environment
        run: |
          sudo apt install aria2 -y
          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox sources
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
          cd ${GITHUB_WORKSPACE}/OrangeFox
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git clone https://gitlab.com/OrangeFox/sync.git -b master
          cd sync
          ./orangefox_sync.sh --branch ${MANIFEST_BRANCH} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}

      - name: Clone device tree
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          git clone ${DEVICE_TREE} -b ${DEVICE_TREE_BRANCH} ./${DEVICE_PATH}
          cd ${DEVICE_PATH}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Trim recovery resources (unused stock AOSP images)
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          echo "== zeroing *_text.png in bootable/recovery"
          COUNT=$(find bootable/recovery -type f -name '*_text.png' -print -exec truncate -s 0 {} + | wc -l)
          echo "zeroed in bootable/recovery: ${COUNT}"
          if [ "${COUNT}" = "0" ]; then
            echo "== nothing found there, searching the whole tree (excluding out/ and .repo/)"
            find . -path ./out -prune -o -path ./.repo -prune -o -type f -name '*_text.png' -print -exec truncate -s 0 {} +
          fi

      - name: Trim UI languages (optional)
        if: ${{ inputs.TRIM_LANGUAGES }}
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          for d in $(find bootable/recovery -type d -name languages); do
            echo "== languages dir: $d"
            find "$d" -maxdepth 1 -type f -name '*.xml' ! -name 'en.xml' ! -name 'uk_UA.xml' ! -name 'ru.xml' -print -delete
          done

      - name: Build OrangeFox
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          set -e
          case "${BUILD_TARGET}" in
            recovery)   TARGET=recoveryimage ;;
            boot)       TARGET=bootimage ;;
            vendorboot) TARGET=vendorbootimage ;;
          esac
          lunch twrp_${DEVICE_NAME}-eng && make clean && mka adbd ${TARGET}

      - name: Size report
        if: always()
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}/out/target/product/${DEVICE_NAME} 2>/dev/null || exit 0
          ls -l *.img 2>/dev/null || true
          echo "limit for recovery partition (image + AVB footer): 33484800 bytes"

      - name: Upload result (also when the size check failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ inputs.DEVICE_NAME }}
          path: |
            OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
            OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/boot.img
            OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.img
            OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
          if-no-files-found: warn
